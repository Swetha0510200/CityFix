<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Municipal Admin Portal – CityFix</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body style="background-color: #0f172a;">

    <main class="py-5 d-flex align-items-center" style="min-height: 100vh;">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    
                    <div class="card p-4 p-md-5 shadow-lg border-0 rounded-4" style="background: #1e293b; color: #f8fafc;">
                        <div class="text-center mb-4">
                            <div class="stat-icon danger mx-auto mb-3" style="width: 55px; height: 55px; font-size: 1.6rem; background: rgba(220, 38, 38, 0.2); color: #f87171;">
                                <i class="bi bi-shield-lock-fill"></i>
                            </div>
                            <h3 class="fw-bold text-white mb-1">Municipal Staff Login</h3>
                            <p class="text-secondary small">Authorized Municipal Corporation Personnel &amp; Department Admins</p>
                        </div>

                        <!-- Alert Box -->
                        <div id="adminLoginAlert" class="alert alert-danger d-none small"></div>

                        <form id="adminLoginForm">
                            <div class="mb-3">
                                <label for="username" class="form-label text-light">Admin Username</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-person-badge"></i></span>
                                    <input type="text" class="form-control bg-dark border-secondary text-white" id="username" placeholder="admin" required autocomplete="username">
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="password" class="form-label text-light">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-key"></i></span>
                                    <input type="password" class="form-control bg-dark border-secondary text-white" id="password" placeholder="••••••••" required autocomplete="current-password">
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 mb-3 shadow">
                                <i class="bi bi-shield-lock"></i> Admin Sign In
                            </button>
                        </form>

                        <!-- Default credentials helper -->
                        <div class="p-3 rounded border border-secondary text-center small text-light mt-2" style="background: rgba(15, 23, 42, 0.6);">
                            <div class="fw-semibold text-warning mb-1"><i class="bi bi-key-fill me-1"></i> Default Admin Credentials</div>
                            <div>Username: <code class="text-info">admin</code></div>
                            <div>Password: <code class="text-info">admin123</code></div>
                        </div>

                        <div class="text-center mt-4 pt-2 border-top border-secondary small">
                            <a th:href="@{/}" class="text-secondary text-decoration-none me-3">&larr; Back to Home</a>
                            <a th:href="@{/login}" class="text-info text-decoration-none">Citizen Portal &rarr;</a>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
    <script th:src="@{/js/auth.js}"></script>
</body>
</html>
