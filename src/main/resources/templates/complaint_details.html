<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaint Details – CityFix</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

    <!-- Header Navigation -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="py-4">
        <div class="container">

            <!-- Breadcrumbs -->
            <nav aria-label="breadcrumb" class="mb-3">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/dashboard}">Dashboard</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/my-complaints}">My Complaints</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Details</li>
                </ol>
            </nav>

            <div id="complaintDetailsContent">
                
                <!-- Status Timeline Card -->
                <div class="cf-card p-4 mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h6 class="text-uppercase fw-bold text-muted small mb-0">Progress Tracker</h6>
                        <span id="detStatusBadge"></span>
                    </div>

                    <!-- Visual Timeline -->
                    <div class="status-timeline">
                        <div class="timeline-step active" id="stepSubmitted">
                            <div class="timeline-node"><i class="bi bi-send-check"></i></div>
                            <div class="timeline-label">Submitted</div>
                        </div>
                        <div class="timeline-step" id="stepAssigned">
                            <div class="timeline-node"><i class="bi bi-person-check"></i></div>
                            <div class="timeline-label">Assigned</div>
                        </div>
                        <div class="timeline-step" id="stepInProgress">
                            <div class="timeline-node"><i class="bi bi-gear-wide-connected"></i></div>
                            <div class="timeline-label">In Progress</div>
                        </div>
                        <div class="timeline-step" id="stepResolved">
                            <div class="timeline-node"><i class="bi bi-check2-all"></i></div>
                            <div class="timeline-label">Resolved</div>
                        </div>
                    </div>
                </div>

                <div class="row g-4">
                    <!-- Left: Details & Remarks -->
                    <div class="col-lg-8">
                        <div class="cf-card p-4 mb-4">
                            <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-3 pb-3 border-bottom">
                                <div>
                                    <div class="d-flex align-items-center gap-2 mb-1">
                                        <span class="fs-5 fw-bold text-primary" id="detComplaintId"></span>
                                        <span class="badge-category" id="detCategory"></span>
                                        <span id="detPriorityBadge"></span>
                                    </div>
                                    <h3 class="fw-bold mb-0" id="detTitle"></h3>
                                </div>
                            </div>

                            <div class="mb-4">
                                <h6 class="fw-bold text-secondary">Description</h6>
                                <p class="lead fs-6 text-dark" id="detDescription" style="white-space: pre-line;"></p>
                            </div>

                            <div class="row g-3 p-3 bg-light rounded-3 border mb-4">
                                <div class="col-md-6">
                                    <div class="text-muted small fw-semibold">Location / Address</div>
                                    <div class="fw-medium text-dark mt-1" id="detLocation"></div>
                                    <div class="small text-primary mt-1 d-none" id="detCoords"></div>
                                </div>
                                <div class="col-md-6">
                                    <div class="text-muted small fw-semibold">Date Filed</div>
                                    <div class="fw-medium text-dark mt-1" id="detCreatedAt"></div>
                                </div>
                            </div>

                            <!-- Admin Remarks Box -->
                            <div class="p-3 bg-info-subtle border border-info-subtle rounded-3 d-none" id="detAdminRemarks">
                                <div class="d-flex align-items-center gap-2 text-info-emphasis fw-bold mb-1">
                                    <i class="bi bi-chat-left-quote-fill"></i>
                                    <span>Official Municipal Remarks</span>
                                </div>
                                <p class="mb-0 text-dark small" id="detRemarksText"></p>
                            </div>
                        </div>
                    </div>

                    <!-- Right: Photo View -->
                    <div class="col-lg-4">
                        <div class="cf-card p-4">
                            <h6 class="fw-bold mb-3"><i class="bi bi-image text-primary me-2"></i>Uploaded Photo</h6>
                            <div id="detImageWrapper" class="text-center d-none">
                                <a href="#" id="detImageLink" target="_blank" title="Click to view full photo">
                                    <img id="detImage" src="" alt="Defect" class="img-fluid rounded border shadow-sm w-100" style="max-height: 280px; object-fit: cover;">
                                </a>
                                <small class="text-muted d-block mt-2"><i class="bi bi-zoom-in"></i> Click image to open in full size</small>
                            </div>
                        </div>

                        <div class="mt-3">
                            <a th:href="@{/my-complaints}" class="btn btn-outline-secondary w-100">
                                <i class="bi bi-arrow-left"></i> Back to Complaints List
                            </a>
                        </div>
                    </div>
                </div>

            </div>

        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
    <script th:src="@{/js/citizen.js}"></script>
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', () => {
            const complaintId = /*[[${complaintIdParam}]]*/ '';
            if (complaintId) {
                loadComplaintDetails(complaintId);
            }
        });
    </script>
</body>
</html>
