<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg cf-navbar sticky-top">
    <div class="container">
        <!-- Logo / Brand -->
        <a class="cf-brand" th:href="@{/}">
            <div class="cf-brand-icon">
                <i class="bi bi-buildings"></i>
            </div>
            <span>CityFix</span>
        </a>

        <!-- Mobile Toggler -->
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">
            <!-- Navigation Links -->
            <ul class="navbar-nav ms-auto align-items-lg-center gap-1">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}"><i class="bi bi-house-door me-1"></i>Home</a>
                </li>

                <!-- Track Complaint (Available to everyone) -->
                <li class="nav-item">
                    <a class="nav-link" href="#" data-bs-toggle="modal" data-bs-target="#trackComplaintModal">
                        <i class="bi bi-search me-1"></i>Track Complaint
                    </a>
                </li>

                <!-- Logged in Citizen Links -->
                <th:block th:if="${isLoggedIn == true and isAdmin != true}">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/dashboard}"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/my-complaints}"><i class="bi bi-card-checklist me-1"></i>My Complaints</a>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-sm btn-primary text-white ms-lg-2 px-3 my-2 my-lg-0" th:href="@{/report-issue}">
                            <i class="bi bi-plus-circle me-1"></i>Report Issue
                        </a>
                    </li>
                    <li class="nav-item dropdown ms-lg-2">
                        <a class="nav-link dropdown-toggle d-flex align-items-center gap-2" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-person-circle fs-5 text-primary"></i>
                            <span th:text="${currentUserName}">Citizen</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0">
                            <li><a class="dropdown-item" th:href="@{/profile}"><i class="bi bi-person me-2"></i>My Profile</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><button class="dropdown-item text-danger" onclick="handleLogout()"><i class="bi bi-box-arrow-right me-2"></i>Logout</button></li>
                        </ul>
                    </li>
                </th:block>

                <!-- Logged in Admin Links -->
                <th:block th:if="${isLoggedIn == true and isAdmin == true}">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/dashboard}"><i class="bi bi-shield-check me-1"></i>Admin Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/complaints}"><i class="bi bi-list-task me-1"></i>Manage Complaints</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/users}"><i class="bi bi-people me-1"></i>Citizens</a>
                    </li>
                    <li class="nav-item ms-lg-2">
                        <button class="btn btn-sm btn-outline-danger px-3 my-2 my-lg-0" onclick="handleAdminLogout()">
                            <i class="bi bi-box-arrow-right me-1"></i>Admin Logout
                        </button>
                    </li>
                </th:block>

                <!-- Public (Logged Out) Links -->
                <th:block th:if="${isLoggedIn != true}">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/login}"><i class="bi bi-box-arrow-in-right me-1"></i>Login</a>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-sm btn-outline-primary ms-lg-1 my-2 my-lg-0" th:href="@{/register}">
                            <i class="bi bi-person-plus me-1"></i>Register
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-sm btn-primary ms-lg-2 my-2 my-lg-0" th:href="@{/report-issue}">
                            <i class="bi bi-megaphone me-1"></i>Report Issue
                        </a>
                    </li>
                    <li class="nav-item ms-lg-2 border-start ps-lg-2">
                        <a class="nav-link text-muted" th:href="@{/admin/login}" title="Municipal Staff Login">
                            <i class="bi bi-shield-lock me-1"></i>Admin Login
                        </a>
                    </li>
                </th:block>
            </ul>
        </div>
    </div>
</nav>

</body>
</html>
