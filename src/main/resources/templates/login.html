<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citizen Sign In – CityFix</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

    <!-- Header Navigation -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    
                    <div class="cf-card p-4 p-md-5 shadow-sm">
                        <div class="text-center mb-4">
                            <div class="cf-brand-icon mx-auto mb-3" style="width: 50px; height: 50px; font-size: 1.5rem;">
                                <i class="bi bi-buildings"></i>
                            </div>
                            <h3 class="fw-bold">Citizen Sign In</h3>
                            <p class="text-muted small">Access your civic dashboard to report issues &amp; track complaints</p>
                        </div>

                        <!-- Alert Box -->
                        <div id="loginAlert" class="alert alert-danger d-none small"></div>

                        <form id="citizenLoginForm">
                            <div class="mb-3">
                                <label for="email" class="form-label">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                                    <input type="email" class="form-control" id="email" placeholder="name@example.com" required autocomplete="email">
                                </div>
                            </div>

                            <div class="mb-4">
                                <div class="d-flex justify-content-between align-items-center mb-1">
                                    <label for="password" class="form-label mb-0">Password</label>
                                </div>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control" id="password" placeholder="••••••••" required autocomplete="current-password">
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 mb-3">
                                <i class="bi bi-box-arrow-in-right"></i> Sign In
                            </button>
                        </form>

                        <div class="text-center small text-muted border-top pt-3 mt-2">
                            Don't have an account? <a th:href="@{/register}" class="fw-bold text-primary text-decoration-none">Register here</a>
                        </div>

                        <!-- Demo credentials helper -->
                        <div class="mt-4 p-3 bg-light rounded border text-center small text-secondary">
                            <div class="fw-semibold text-dark mb-1"><i class="bi bi-info-circle text-primary me-1"></i> Demo Citizen Account</div>
                            <div>Email: <code class="text-primary">citizen@cityfix.com</code></div>
                            <div>Password: <code class="text-primary">citizen123</code></div>
                        </div>
                    </div>

                    <div class="text-center mt-3 small text-muted">
                        Are you an administrator? <a th:href="@{/admin/login}" class="text-secondary fw-semibold">Admin Login &rarr;</a>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
    <script th:src="@{/js/auth.js}"></script>
</body>
</html>
