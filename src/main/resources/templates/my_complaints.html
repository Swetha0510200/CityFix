<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Complaints – CityFix</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

    <!-- Header Navigation -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="py-4">
        <div class="container">

            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4 pb-2 border-bottom">
                <div>
                    <h2 class="fw-bold mb-1">My Submitted Complaints</h2>
                    <p class="text-muted mb-0">Search, filter, and track progress on all civic issues you've raised.</p>
                </div>
                <div>
                    <a th:href="@{/report-issue}" class="btn btn-primary shadow-sm">
                        <i class="bi bi-plus-circle me-1"></i> Report New Issue
                    </a>
                </div>
            </div>

            <!-- Search & Filter Controls -->
            <div class="cf-card p-3 mb-4">
                <div class="row g-3">
                    <div class="col-md-5">
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-search"></i></span>
                            <input type="text" class="form-control" id="searchComplaint" placeholder="Search by Complaint ID, title, or location...">
                        </div>
                    </div>
                    <div class="col-md-4">
                        <select class="form-select" id="filterCategory">
                            <option value="">All Categories</option>
                            <option value="Pothole">Pothole</option>
                            <option value="Garbage">Garbage</option>
                            <option value="Streetlight">Streetlight</option>
                            <option value="Water Leakage">Water Leakage</option>
                            <option value="Drainage">Drainage</option>
                            <option value="Road Damage">Road Damage</option>
                            <option value="Traffic Signal">Traffic Signal</option>
                            <option value="Public Toilet">Public Toilet</option>
                            <option value="Illegal Dumping">Illegal Dumping</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <select class="form-select" id="filterStatus">
                            <option value="">All Statuses</option>
                            <option value="Pending">Pending</option>
                            <option value="Assigned">Assigned</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Resolved">Resolved</option>
                            <option value="Rejected">Rejected</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Complaints List Container -->
            <div id="complaintsList">
                <div class="text-center py-5">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="text-muted mt-2">Loading complaints...</p>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
    <script th:src="@{/js/citizen.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadMyComplaints();
        });
    </script>
</body>
</html>
