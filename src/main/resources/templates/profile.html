<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile – CityFix</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

    <!-- Header Navigation -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="py-4">
        <div class="container">

            <div class="row justify-content-center">
                <div class="col-lg-8">

                    <!-- Breadcrumbs -->
                    <nav aria-label="breadcrumb" class="mb-3">
                        <ol class="breadcrumb">
                            <li class="breadcrumb-item"><a th:href="@{/dashboard}">Dashboard</a></li>
                            <li class="breadcrumb-item active" aria-current="page">My Profile</li>
                        </ol>
                    </nav>

                    <div class="cf-card p-4 p-md-5">
                        <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
                            <div class="stat-icon primary" style="width: 55px; height: 55px; font-size: 1.6rem;">
                                <i class="bi bi-person-badge"></i>
                            </div>
                            <div>
                                <h3 class="fw-bold mb-0">Citizen Profile</h3>
                                <p class="text-muted small mb-0">Manage your contact details and security credentials.</p>
                            </div>
                        </div>

                        <!-- Stats Row -->
                        <div class="row g-3 mb-4">
                            <div class="col-sm-6">
                                <div class="p-3 bg-light rounded-3 border">
                                    <div class="small text-muted fw-semibold">Total Complaints Raised</div>
                                    <div class="fs-4 fw-bold text-primary" id="profileComplaintCount">0</div>
                                </div>
                            </div>
                            <div class="col-sm-6">
                                <div class="p-3 bg-light rounded-3 border">
                                    <div class="small text-muted fw-semibold">Member Since</div>
                                    <div class="fs-6 fw-bold text-dark mt-1" id="profileJoined">-</div>
                                </div>
                            </div>
                        </div>

                        <!-- Alert Box -->
                        <div id="profileAlert" class="alert alert-danger d-none small"></div>

                        <form id="profileForm">
                            <h5 class="fw-bold mb-3">Personal Details</h5>
                            
                            <div class="mb-3">
                                <label for="profileName" class="form-label">Full Name</label>
                                <input type="text" class="form-control" id="profileName" required minlength="2" maxlength="100">
                            </div>

                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label for="profileEmail" class="form-label">Email Address</label>
                                    <input type="email" class="form-control bg-light" id="profileEmail" readonly title="Email cannot be changed">
                                    <div class="form-text">Used for account identification.</div>
                                </div>
                                <div class="col-md-6">
                                    <label for="profilePhone" class="form-label">Phone Number</label>
                                    <input type="tel" class="form-control" id="profilePhone" required>
                                </div>
                            </div>

                            <hr class="my-4">

                            <h5 class="fw-bold mb-2">Change Password</h5>
                            <p class="text-muted small mb-3">Leave password fields blank if you do not wish to change it.</p>

                            <div class="mb-3">
                                <label for="currentPassword" class="form-label">Current Password</label>
                                <input type="password" class="form-control" id="currentPassword" placeholder="••••••••">
                            </div>

                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label for="newPassword" class="form-label">New Password</label>
                                    <input type="password" class="form-control" id="newPassword" placeholder="Min. 6 characters">
                                </div>
                                <div class="col-md-6">
                                    <label for="confirmNewPassword" class="form-label">Confirm New Password</label>
                                    <input type="password" class="form-control" id="confirmNewPassword" placeholder="Repeat new password">
                                </div>
                            </div>

                            <div class="d-flex justify-content-end gap-2 pt-2 border-top">
                                <a th:href="@{/dashboard}" class="btn btn-outline-secondary">Back to Dashboard</a>
                                <button type="submit" class="btn btn-primary px-4">
                                    <i class="bi bi-check2-circle"></i> Save Changes
                                </button>
                            </div>
                        </form>

                    </div>

                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
    <script th:src="@{/js/citizen.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadProfile();
            initProfileForm();
        });
    </script>
</body>
</html>
