<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Civic Issue – CityFix</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

    <!-- Header Navigation -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="py-4">
        <div class="container">

            <div class="row justify-content-center">
                <div class="col-lg-8">

                    <!-- Breadcrumbs -->
                    <nav aria-label="breadcrumb" class="mb-3">
                        <ol class="breadcrumb">
                            <li class="breadcrumb-item"><a th:href="@{/dashboard}">Dashboard</a></li>
                            <li class="breadcrumb-item active" aria-current="page">Report Issue</li>
                        </ol>
                    </nav>

                    <div class="cf-card p-4 p-md-5">
                        <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
                            <div class="stat-icon primary" style="width: 50px; height: 50px; font-size: 1.5rem;">
                                <i class="bi bi-megaphone-fill"></i>
                            </div>
                            <div>
                                <h3 class="fw-bold mb-0">Report a Civic Issue</h3>
                                <p class="text-muted small mb-0">Provide accurate details to assist municipal officers in taking speedy action.</p>
                            </div>
                        </div>

                        <!-- Alert Box -->
                        <div id="reportAlert" class="alert alert-danger d-none small"></div>

                        <form id="reportIssueForm">
                            <!-- Issue Title -->
                            <div class="mb-3">
                                <label for="title" class="form-label">Issue Title <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="title" placeholder="e.g. Deep pothole near Sector 14 crossroad" required minlength="3" maxlength="200">
                                <div class="form-text">Keep it clear and descriptive.</div>
                            </div>

                            <!-- Category & Priority -->
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label for="category" class="form-label">Category <span class="text-danger">*</span></label>
                                    <select class="form-select" id="category" required>
                                        <option value="" disabled selected>-- Select Category --</option>
                                        <option value="Pothole">Pothole</option>
                                        <option value="Garbage">Garbage</option>
                                        <option value="Streetlight">Streetlight</option>
                                        <option value="Water Leakage">Water Leakage</option>
                                        <option value="Drainage">Drainage</option>
                                        <option value="Road Damage">Road Damage</option>
                                        <option value="Traffic Signal">Traffic Signal</option>
                                        <option value="Public Toilet">Public Toilet</option>
                                        <option value="Illegal Dumping">Illegal Dumping</option>
                                        <option value="Other">Other</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label for="priority" class="form-label">Estimated Priority</label>
                                    <select class="form-select" id="priority">
                                        <option value="Low">Low (Minor inconvenience)</option>
                                        <option value="Medium" selected>Medium (Standard civic issue)</option>
                                        <option value="High">High (Immediate hazard / health risk)</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Location & GPS -->
                            <div class="mb-3">
                                <div class="d-flex justify-content-between align-items-center mb-1">
                                    <label for="location" class="form-label mb-0">Location / Address / Landmark <span class="text-danger">*</span></label>
                                    <button type="button" class="btn btn-sm btn-outline-primary py-0 px-2" id="getGeoBtn">
                                        <i class="bi bi-crosshair"></i> Auto-Detect GPS
                                    </button>
                                </div>
                                <input type="text" class="form-control" id="location" placeholder="e.g. 5th Main Road, Near Central Library, Ward 7" required maxlength="255">
                            </div>

                            <!-- Optional Hidden / Semi-hidden Coords -->
                            <div class="row g-2 mb-3">
                                <div class="col-6">
                                    <label for="latitude" class="form-label small text-muted">Latitude (Optional)</label>
                                    <input type="number" step="any" class="form-control form-control-sm" id="latitude" placeholder="e.g. 28.6139">
                                </div>
                                <div class="col-6">
                                    <label for="longitude" class="form-label small text-muted">Longitude (Optional)</label>
                                    <input type="number" step="any" class="form-control form-control-sm" id="longitude" placeholder="e.g. 77.2090">
                                </div>
                            </div>

                            <!-- Description -->
                            <div class="mb-3">
                                <label for="description" class="form-label">Detailed Description <span class="text-danger">*</span></label>
                                <textarea class="form-control" id="description" rows="4" placeholder="Explain the severity, how long it has existed, and exact surroundings..." required minlength="10" maxlength="3000"></textarea>
                                <div class="form-text">Minimum 10 characters.</div>
                            </div>

                            <!-- Image Upload -->
                            <div class="mb-4">
                                <label class="form-label">Upload Defect Photo (Optional)</label>
                                <input type="file" class="form-control mb-2" id="imageFile" accept="image/jpeg,image/png,image/webp,image/jpg">
                                <div class="form-text">Accepted formats: JPG, JPEG, PNG, WEBP (Max size: 10MB).</div>
                                
                                <!-- Preview Box -->
                                <div id="imagePreviewBox" class="mt-3 p-2 bg-light rounded text-center border d-none">
                                    <img id="previewImg" src="" alt="Preview" class="preview-img mb-2">
                                    <div class="small text-muted">Image selected for upload</div>
                                </div>
                            </div>

                            <!-- Action Buttons -->
                            <div class="d-flex gap-2 justify-content-end pt-2 border-top">
                                <a th:href="@{/dashboard}" class="btn btn-outline-secondary">Cancel</a>
                                <button type="submit" class="btn btn-primary px-4">
                                    <i class="bi bi-send-fill"></i> Submit Complaint
                                </button>
                            </div>
                        </form>

                    </div>

                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
    <script th:src="@{/js/citizen.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initReportIssueForm();
        });
    </script>
</body>
</html>
